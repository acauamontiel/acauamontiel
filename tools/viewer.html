<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Visualizador de modelo</title>
<style>html,body{margin:0;background:#2a2d33;color:#ddd;font:12px monospace;overflow:hidden}#list{position:fixed;left:6px;top:6px;white-space:pre;pointer-events:none;text-shadow:0 0 3px #000}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}</script>
</head>
<body>
<div id="list" style="display:none"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const file = q.get('file') || '../assets/astra.glb';
const only = (q.get('only') || '').split(',').filter(Boolean);
const hide = (q.get('hide') || '').split(',').filter(Boolean);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2d33);
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x403830, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3, 6, 4); scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xffe0c0, 0.7); sun2.position.set(-4, 2, -5); scene.add(sun2);
scene.add(new THREE.GridHelper(6, 12, 0x555, 0x444));
const names = [];
new GLTFLoader().load(file, (g) => {
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    const n = o.name || o.parent.name;
    if (only.length && !only.some((p) => n.startsWith(p))) o.visible = false;
    if (hide.some((p) => n.startsWith(p))) o.visible = false;
    if (o.visible && !names.includes(n)) names.push(n + '  ' + (o.geometry.index ? o.geometry.index.count / 3 : 0) + ' tris');
  });
  scene.add(g.scene);
  const list = document.getElementById('list'); list.textContent = names.join('\n'); list.style.display = q.has('list') ? 'block' : 'none';
  draw();
});
const views = {
  isoFL: [[-3.6, 2.2, -4.2], [0, 0.5, 0]], isoRR: [[3.6, 2.0, 4.4], [0, 0.5, 0]], side: [[-6.5, 1.0, 0], [0, 0.6, 0]],
  rear: [[0, 1.3, 6.2], [0, 0.5, 0]], front: [[0, 1.3, -6.2], [0, 0.5, 0]], top: [[0.01, 7.5, 0], [0, 0, 0]],
  chase: [[0, 3.1, 6.8], [0, 0.4, -12]], low: [[2.5, 0.3, -3.5], [0, 0.4, 0]],
};
const want = (q.get('views') || 'isoFL,isoRR,side,rear,front,top').split(',');
function draw() {
  const cols = want.length > 3 ? 3 : want.length, rows = Math.ceil(want.length / cols);
  const w = Math.floor(innerWidth / cols), h = Math.floor(innerHeight / rows);
  want.forEach((v, i) => {
    const [pos, at] = views[v];
    const cam = new THREE.PerspectiveCamera(q.get('fov') ? +q.get('fov') : 40, w / h, 0.1, 100);
    cam.position.set(...pos); cam.lookAt(...at);
    const x = (i % cols) * w, y = innerHeight - (Math.floor(i / cols) + 1) * h;
    renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.render(scene, cam);
  });
  document.body.dataset.ready = '1';
}
</script>
</body>
</html>
